# Runs the full gate board on every push and pull request, then has Claude
# summarise the board on the PR.
name: gates
on: [push, pull_request]
permissions: { contents: read, pull-requests: write, id-token: write }
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Job-level env MAY read secrets; a step-level `if:` may NOT reference
      # secrets directly. Prefer the immutable release-manifest contract, while
      # retaining the legacy data URL/tarball modes during migration.
      HAS_DATA: ${{ secrets.OBC_RELEASE_MANIFEST != '' || secrets.OBC_DATA_URL != '' || secrets.OBC_DATA_TARBALL != '' }}
    steps:
      - uses: actions/checkout@v4
        # no lfs: true - the repo has no LFS objects by design (.gitattributes)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: dependencies (CPU-only torch — the CUDA wheel is ~2.5 GB and unused)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}
      - name: release installer is falsifiable
        run: python3 ci/test_release_installer.py
      - name: control-plane runner is falsifiable
        run: python3 ci/test_control_plane.py
      - name: hooks are falsifiable
        run: bash ci/test_hooks.sh
      - name: DAG consistency
        run: python3 orchestration/schedule.py --check
      - name: fetch derived data (manifest/hash verified)
        if: ${{ env.HAS_DATA == 'true' }}
        env:
          OBC_RELEASE_MANIFEST: ${{ secrets.OBC_RELEASE_MANIFEST }}
          OBC_RELEASE_ARCHIVE: ${{ secrets.OBC_RELEASE_ARCHIVE }}
          OBC_RELEASE_BASE_URL: ${{ secrets.OBC_RELEASE_BASE_URL }}
          OBC_DATA_URL: ${{ secrets.OBC_DATA_URL }}
          OBC_DATA_TARBALL: ${{ secrets.OBC_DATA_TARBALL }}
        run: bash ci/fetch_data.sh
      - name: note that the data fetch was skipped
        if: ${{ env.HAS_DATA != 'true' }}
        run: |
          echo "::warning title=Corpus gates not evaluated::No OBC release manifest or legacy data URL/tarball secret is set. CI will run the explicit control-plane board only."
          {
            echo "### Derived data fetch skipped"
            echo
            echo "No \`OBC_RELEASE_MANIFEST\`, \`OBC_DATA_URL\`, or \`OBC_DATA_TARBALL\` secret is configured, so the derived corpus was not fetched."
            echo
            echo "CI will run the **control-plane board only**. DATA1 and all corpus-dependent gates will be recorded as not evaluated/skipped; the ordinary full board remains fail-closed when invoked without data."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: fetch Crown-copyright sources from secrets (URLs never enter agent context)
        env:
          OBC_PDF_URL_V1: ${{ secrets.OBC_PDF_URL_V1 }}
          OBC_PDF_URL_V2: ${{ secrets.OBC_PDF_URL_V2 }}
        run: bash ci/fetch_sources.sh
      - name: regenerate derived artifacts in dependency order
        if: ${{ env.HAS_DATA == 'true' }}
        run: bash ci/regenerate.sh
      - name: gate board (full — includes the slow gates the Stop hook skips)
        if: ${{ env.HAS_DATA == 'true' }}
        env: { OBC_CHECK_EMBED: "1" }
        run: python3 ci/run_gates.py
      - name: gate board (control-plane — corpus unavailable)
        if: ${{ env.HAS_DATA != 'true' }}
        run: python3 ci/run_gates.py --control-plane
      - name: CI1 — the board must be able to go red
        run: python3 ci/run_gates.py --control
      - name: H10 — every ratio gate must be falsifiable
        if: ${{ env.HAS_DATA == 'true' }}
        run: python3 harden/checks/check35_controls.py --db emitters/obc-mod.sqlite
      - name: G2 — the cannot list is computed and falsifiable
        if: ${{ env.HAS_DATA == 'true' }}
        run: cd retrieval && python3 checks/check38_capabilities.py --db ../emitters/obc-mod.sqlite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-board
          path: ci/gate-board.json
          if-no-files-found: error
      - name: summarise the board on the PR
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read ci/gate-board.json. Post ONE PR comment via `gh pr comment ${{ github.event.pull_request.number }}`:
            state summary.mode first. If it is control-plane, explicitly say the hydrated corpus/full board was not evaluated.
            Then list each FAIL and KNOWN gate with its check and result line; each SKIP with its reason;
            and the summary counts. Do not edit any file. Do not re-run anything.
          claude_args: |
            --max-turns 6
            --permission-mode dontAsk
            --allowedTools "Read,Bash(gh pr comment:*)"
            --max-budget-usd 1.00
