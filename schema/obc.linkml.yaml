id: https://obc.local/schema/obc
name: obc-docgraph
title: Ontario Building Code document graph — declared schema
description: >-
  The declared shape of the OBC document graph. Two jobs. (1) Close the type
  system: NodeType and EdgeKind are closed enums, so an undeclared type fails
  validation instead of flowing silently into the emitters. (2) Make known
  dual-encoding defects unrepresentable rather than merely discouraged.
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml: https://w3id.org/linkml/
  obc: https://obc.local/schema/obc/
default_prefix: obc
default_range: string
imports:
  - linkml:types

enums:
  NodeType:
    description: >-
      Every node type the pipeline can emit. `role` partitions them into the
      three disjoint structural classes of Node.
    permissible_values:
      division:               {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      part:                   {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      contents:               {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      section:                {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      subsection:             {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      article:                {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      act:                    {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      act_section:            {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      front_matter:           {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      index:                  {annotations: {role: container, src: "pipeline/stage3_tree.py"}}
      appendix:               {annotations: {role: container, src: "pipeline/vol2/stage3v2_tree.py:127"}}
      supplementary_standard: {annotations: {role: container, src: "pipeline/vol2/stage3v2_tree.py:127"}}
      note:                   {annotations: {role: container, src: "pipeline/vol2/stage3v2_tree.py:145"}}
      sentence:               {annotations: {role: provision, src: "pipeline/stage3_tree.py"}}
      clause:                 {annotations: {role: provision, src: "pipeline/stage3_tree.py"}}
      subclause:              {annotations: {role: provision, src: "pipeline/stage3_tree.py"}}
      act_subsection:         {annotations: {role: provision, src: "pipeline/stage3_tree.py"}}
      act_clause:             {annotations: {role: provision, src: "pipeline/stage3_tree.py"}}
      act_subclause:          {annotations: {role: provision, src: "pipeline/stage3_tree.py"}}
      table:                  {annotations: {role: other, src: "pipeline/stage5_bind.py"}}
      defined_term:           {annotations: {role: other, src: "retrieval/stage18_definitions.py"}}
      index_entry:            {annotations: {role: other, src: "pipeline/stage3_tree.py"}}
      index_subentry:         {annotations: {role: other, src: "pipeline/stage3_tree.py"}}

  EdgeKind:
    description: >-
      Every relation the graph can carry between two nodes, other than
      containment. Every permissible value carries a reverse traversal label.
    permissible_values:
      code_ref: {description: "citation to a Code provision",
                 annotations: {reverse: cited_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      cap_ref:  {description: "prose citing a Table or Figure. NOT a table's own binding",
                 annotations: {reverse: cited_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      act_ref:  {description: "citation to the Building Code Act, 1992",
                 annotations: {reverse: cited_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      short:    {description: "short-form Act citation, s. / ss.",
                 annotations: {reverse: cited_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      note:     {description: "Appendix A explanatory note",
                 annotations: {reverse: explains, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      supp:     {description: "Supplementary Standard SA/SB/SC",
                 annotations: {reverse: applied_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      form:     {description: "Volume 2 Form",
                 annotations: {reverse: used_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      ca:       {description: "compliance-alternative row",
                 annotations: {reverse: alternative_for, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      std:      {description: "referenced standard, Table 1.3.1.2",
                 annotations: {reverse: referenced_by, dst_optional: "true", src: "pipeline/stage7_refs.py"}}
      term:     {description: "use of a defined term",
                 annotations: {reverse: used_in, dst_optional: "false", src: "pipeline/stage7_refs.py and retrieval/stage18_definitions.py"}}
      forms_part_of: {description: "a Table forms part of the Code provision level named by its printed caption",
                 annotations: {reverse: has_forming_part, dst_optional: "false", src: "pipeline/stage5_bind.py and pipeline/emitters/stage15_sqlite.py"}}

  Resolution:
    permissible_values:
      exact:            {annotations: {resolved: "true"}}
      other_division:   {annotations: {resolved: "true"}}
      singular:         {annotations: {resolved: "true", src: "retrieval/stage18_definitions.py"}}
      not_in_edition:   {annotations: {resolved: "false"}}
      not_in_table_1_3_1_2: {annotations: {resolved: "false"}}
      figure_asset:     {annotations: {resolved: "false"}}
      external_volume2: {annotations: {resolved: "false"}}
      compliance_alternative_row: {annotations: {resolved: "false"}}

  Modality:
    permissible_values:
      prohibition: {}
      obligation: {}
      permission: {}
      exemption: {}
      statement: {}

  AmendmentKind:
    permissible_values:
      amended: {}
      new: {}
      revoked: {}
      unchanged: {}

slots:
  id:         {identifier: true, description: "citation-grammar node id, e.g. B/9/9.32.3.8/(1)/(a)"}
  type:       {range: NodeType, required: true}
  parent:     {range: Node, inverse: children,
               description: "CONTAINMENT ONLY. Physical/structural position in the document tree."}
  children:   {range: Node, multivalued: true, inverse: parent}
  volume:     {range: integer}
  number:     {}
  designator: {}
  heading:    {}
  body:       {}
  depth:      {range: integer}
  page:       {range: integer}
  bbox:       {range: float, multivalued: true, exact_mappings: [obc:bbox_x0y0x1y1]}
  permalink:  {range: uriorcurie}
  modality:   {range: Modality}
  src:        {range: Node, required: true}
  dst:        {range: Node, description: "absent iff the citation did not resolve"}
  kind:       {range: EdgeKind, required: true}
  resolution: {range: Resolution, required: true}
  text:       {description: "the citing surface string, verbatim"}
  chunk:      {description: "'*' for joined body, 'h' for a heading, gN for grid cell N"}
  span_start: {range: integer}
  span_end:   {range: integer}
  forms_part_of:
    range: Node
    multivalued: true
    description: >-
      Semantic table binding. Printed captions can name a Section, Subsection,
      Article, Sentence, Clause or Subclause. The current hydrated corpus has
      sentence, article and subsection targets; therefore this relation cannot
      correctly be restricted to leaf Provision nodes alone.
    annotations:
      allowed_node_types: "section,subsection,article,sentence,clause,subclause,act_section,act_subsection,act_clause,act_subclause"

classes:
  DocumentGraph:
    tree_root: true
    annotations: {closed: "true"}
    slots: []
    attributes:
      nodes:      {range: Node, multivalued: true, inlined_as_list: true, required: true}
      edges:      {range: Edge, multivalued: true, inlined_as_list: true, required: true}
      amendments: {range: Amendment, multivalued: true, inlined_as_list: true}
      current_to: {range: date, required: true}
      through:    {required: true}

  Node:
    abstract: true
    annotations: {closed: "true"}
    slots: [id, type, parent, children, volume, number, designator, heading,
            body, depth, page, bbox, permalink]

  StructuralContainer:
    is_a: Node
    annotations: {closed: "true"}
    slot_usage:
      type: {range: NodeType, any_of: [{equals_string: division}, {equals_string: part},
             {equals_string: contents}, {equals_string: section}, {equals_string: subsection},
             {equals_string: article}, {equals_string: act}, {equals_string: act_section},
             {equals_string: front_matter}, {equals_string: index}, {equals_string: appendix},
             {equals_string: supplementary_standard}, {equals_string: note}]}

  Provision:
    is_a: Node
    annotations: {closed: "true"}
    slots: [modality]
    slot_usage:
      body: {required: true}
      type: {range: NodeType, any_of: [{equals_string: sentence}, {equals_string: clause},
             {equals_string: subclause}, {equals_string: act_subsection},
             {equals_string: act_clause}, {equals_string: act_subclause}]}

  Table:
    is_a: Node
    annotations:
      closed: "true"
      defect: >-
        `parent` is structural containment and is narrowed to
        StructuralContainer. A printed "Forming Part of" caption is encoded in
        the separate `forms_part_of` relation, whose allowed target levels are
        declared on that slot and enforced by check36 against the emitted DB.
    slots: [forms_part_of]
    slot_usage:
      type:   {range: NodeType, equals_string: table}
      parent: {range: StructuralContainer, required: true}
      forms_part_of: {recommended: true}
    attributes:
      nrows: {range: integer}
      ncols: {range: integer}
      cells: {range: Cell, multivalued: true, inlined_as_list: true}

  DefinedTerm:
    is_a: Node
    annotations: {closed: "true"}
    slot_usage:
      type: {range: NodeType, equals_string: defined_term}
      body: {required: true}
      heading: {required: true}
    attributes:
      norm: {required: true}
      blob: {range: Node, required: true}

  IndexEntry:
    is_a: Node
    annotations: {closed: "true"}
    slot_usage:
      type: {range: NodeType, any_of: [{equals_string: index_entry}, {equals_string: index_subentry}]}

  Edge:
    annotations:
      closed: "true"
      defect: >-
        Relation semantics converge on one Edge class. Ordinary citations,
        defined-term uses, and table-to-provision bindings differ by Edge.kind.
    slots: [src, dst, kind, resolution, text, chunk, span_start, span_end]
    unique_keys:
      one_edge_per_span:
        unique_key_slots: [src, kind, chunk, span_start]
    rules:
      - title: R1_resolved_iff_dst
        preconditions:
          slot_conditions:
            resolution: {any_of: [{equals_string: exact}, {equals_string: other_division},
                                  {equals_string: singular}]}
        postconditions:
          slot_conditions:
            dst: {required: true}
      - title: R2_term_always_resolves_to_a_definition
        preconditions: {slot_conditions: {kind: {equals_string: term}}}
        postconditions: {slot_conditions: {dst: {range: DefinedTerm, required: true}}}
      - title: R3_cap_ref_is_never_a_binding
        preconditions: {slot_conditions: {kind: {equals_string: cap_ref}}}
        postconditions: {slot_conditions: {src: {range: Node, none_of: [{range: Table}]}}}
      - title: R4_forms_part_of_is_table_to_declared_code_level
        description: >-
          Source is always a Table. Destination is validated by check36 against
          the allowed_node_types annotation on the forms_part_of slot because
          the printed caption can bind at container or leaf provision levels.
        preconditions: {slot_conditions: {kind: {equals_string: forms_part_of}}}
        postconditions:
          slot_conditions:
            src: {range: Table, required: true}
            dst: {range: Node, required: true}
            resolution: {equals_string: exact}

  Cell:
    annotations: {closed: "true"}
    attributes:
      r: {range: integer, required: true}
      c: {range: integer, required: true}
      rowspan: {range: integer}
      colspan: {range: integer}
      page: {range: integer}
      text: {}

  Amendment:
    annotations: {closed: "true"}
    attributes:
      node:       {range: Node, required: true}
      marker:     {}
      kind:       {range: AmendmentKind, required: true}
      instrument: {}
      effective:  {range: date}
